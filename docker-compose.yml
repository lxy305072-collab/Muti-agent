
# 凭据统一从 .env 读取（docker compose 会自动加载同目录的 .env）
# 首次使用请先执行：cp .env.example .env 并填入真实值
# ⚠️ 下方 ${VAR:-default} 的 default 是占位符，不是可用密码。
#    未配置 .env 时容器仍能启动，但会用这个占位密码，客户端必须填相同值才能连上。
#    正常用法：把 .env 配好，docker compose 会自动取到真实值，无需改动本文件。

services:
  redis:
    image: redis:7.2-alpine  # 推荐使用 alpine 版本，体积更小
    container_name: my-redis-compose
    restart: always           #  Docker 重启时自动重启容器
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data    # 将数据挂载到当前目录的 redis-data 文件夹
    # 如果没有挂载 redis.conf，可以直接用：
    # ⚠️ 必须与 .env / config.py 的 REDIS_PASSWORD 保持一致，否则客户端 AUTH 会报错
    #    Redis 的 requirepass 每次启动容器都会生效，改 .env 后重建容器即可生效
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-change_me_in_dotenv}"

  postgres:
    # 官方镜像自带 pgvector 插件，免去手动编译烦恼
    image: pgvector/pgvector:pg16
    container_name: marketing-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-myuser}                    # 用户名
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_dotenv} # 密码
      POSTGRES_DB: ${POSTGRES_DB:-marketing_db}                   # 默认创建的数据库名
    ports:
      - "5432:5432"
    volumes:
      # 将数据持久化到本地当前目录的 ./pgdata 文件夹
      - ./data/pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    # ⚠️ PostgreSQL 仅在数据目录为空（首次初始化）时应用 POSTGRES_PASSWORD。
    #    若 ./data/pgdata 已存在，改 .env 中的密码不会自动生效，需手动执行：
    #    ALTER USER myuser WITH PASSWORD '新密码';



volumes:
  redis-data:
